<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計算バトル - 攻撃力測定</title>
    <style>
        :root { --primary: #ff4500; --secondary: #ffd700; }
        body { font-family: 'Arial Black', sans-serif; text-align: center; background-color: #1a1a1a; color: white; margin: 0; padding: 15px; overflow-x: hidden; }
        #game-container { max-width: 450px; margin: 0 auto; padding: 20px; background: #2a2a2a; border: 4px solid #444; border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* ルール解説ボックス */
        .rules-box { background: rgba(0,0,0,0.5); border: 1px dashed var(--primary); border-radius: 8px; padding: 12px; margin-bottom: 15px; text-align: left; font-size: 13px; color: #ddd; line-height: 1.5; }
        .rules-box h4 { margin: 0 0 8px 0; color: var(--primary); font-size: 15px; text-align: center; letter-spacing: 2px; }
        .rules-box ul { margin: 0; padding-left: 20px; }
        .rules-box li { margin-bottom: 5px; }
        .highlight { color: var(--secondary); font-weight: bold; }

        /* 設定画面 */
        .settings-box { background: #333; border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: left; border-left: 5px solid var(--primary); }
        h3 { font-size: 14px; margin: 0 0 10px 0; color: var(--secondary); }
        .checkbox-group label, .radio-group label { display: inline-block; margin-right: 12px; font-size: 16px; cursor: pointer; padding: 5px; }

        /* ゲーム画面 */
        #question { font-size: 60px; margin: 15px 0; text-shadow: 3px 3px 0 #000; color: #fff; height: 80px; }
        #timer { font-size: 28px; color: #ff4500; text-shadow: 0 0 10px #ff4500; }
        #score-display { font-size: 20px; color: var(--secondary); margin-bottom: 10px; }
        
        /* ボタン */
        #choices { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 140px; }
        .choice-btn { 
            flex: 1 1 40%; font-size: 32px; padding: 15px; background: linear-gradient(#555, #222); color: white; 
            border: 3px solid #666; border-radius: 15px; cursor: pointer;
        }
        .choice-btn:active { transform: scale(0.95); background: #444; }
        
        /* 派手な演出用 */
        .start-btn { 
            font-size: 22px; padding: 15px; background: linear-gradient(var(--primary), #b32d00); color: white; 
            border: none; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; box-shadow: 0 5px 0 #802000;
        }
        .start-btn:active { transform: translateY(3px); box-shadow: none; }

        /* 結果画面の詳細表示 */
        #result-screen h2 { font-size: 24px; color: var(--primary); margin-bottom: 0; }
        .atk-value { font-size: 64px; color: var(--secondary); text-shadow: 0 0 20px #ff8c00; margin: 5px 0; display: block; }
        .rank-badge { font-size: 80px; font-style: italic; color: #fff; text-shadow: 0 0 30px #fff; display: block; margin-top: -10px; }
        
        .detail-box { 
            background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; margin: 20px 0; text-align: left; 
            font-size: 14px; line-height: 1.6; border: 1px solid #444;
        }
        .detail-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #444; padding: 3px 0; }
        .detail-label { color: #aaa; }
        .detail-value { color: #fff; font-weight: bold; }

        @keyframes shake { 0% { transform: translate(1px, 1px); } 10% { transform: translate(-1px, -2px); } 100% { transform: translate(1px, -2px); } }
        .shake { animation: shake 0.2s infinite; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <h1 style="color:var(--secondary); margin-top:0;">MATH BATTLE</h1>
        
        <div class="rules-box">
            <h4>- HOW TO PLAY -</h4>
            <ul>
                <li>30秒間でより多くの問題（敵）を解け！</li>
                <li><span class="highlight">攻撃力の秘密：</span>「選択肢を増やす」「×や÷を含める」と、難易度ボーナスとして最終スコアに高い倍率がかかります。</li>
                <li>伝説の<span class="highlight">【SSSランク】</span>は、最高難易度（4択＋全計算ON）にしないと到達不可能だ！</li>
            </ul>
        </div>

        <div class="settings-box">
            <div class="setting-group">
                <h3>計算スキル（四則演算）</h3>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="op-add" checked> ＋</label>
                    <label><input type="checkbox" id="op-sub" checked> －</label>
                    <label><input type="checkbox" id="op-mul" checked> ×</label>
                    <label><input type="checkbox" id="op-div" checked> ÷</label>
                </div>
            </div>
            <div class="setting-group">
                <h3>ターゲット数（選択肢）</h3>
                <div class="radio-group">
                    <label><input type="radio" name="choiceCount" value="2"> 2</label>
                    <label><input type="radio" name="choiceCount" value="3"> 3</label>
                    <label><input type="radio" name="choiceCount" value="4" checked> 4</label>
                </div>
            </div>
        </div>
        <button class="start-btn" onclick="startGame()">バトル開始！</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="timer">TIME: 30</div>
        <div id="score-display">KILL COUNT: 0</div>
        <div id="question"></div>
        <div id="choices"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>ATTACK POWER</h2>
        <span id="final-atk" class="atk-value">0</span>
        <div id="rank-display" class="rank-badge">-</div>
        
        <div class="detail-box">
            <div class="detail-item">
                <span class="detail-label">プレイ日時</span>
                <span id="res-datetime" class="detail-value">-</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">正解問題数</span>
                <span id="res-count" class="detail-value">-</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">計算設定</span>
                <span id="res-ops" class="detail-value">-</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">選択肢数</span>
                <span id="res-choices" class="detail-value">-</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">連続プレイ回数</span>
                <span id="res-playcount" class="detail-value" style="color:var(--secondary)">-</span>
            </div>
        </div>

        <button class="start-btn" onclick="retryGame()">もう一度バトル！</button>
        <p style="margin-top:15px; font-size:14px; color:#aaa; cursor:pointer; text-decoration:underline;" onclick="location.reload()">設定を変更する</p>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 30;
    let correctAnswer;
    let timerId;
    let activeOps = [];
    let numChoices = 4;
    let totalPlayCount = 0; // セッション内の連続プレイ数

    function startGame() {
        activeOps = [];
        if (document.getElementById('op-add').checked) activeOps.push('＋');
        if (document.getElementById('op-sub').checked) activeOps.push('－');
        if (document.getElementById('op-mul').checked) activeOps.push('×');
        if (document.getElementById('op-div').checked) activeOps.push('÷');

        if (activeOps.length === 0) { alert('スキルを選んでください！'); return; }

        numChoices = parseInt(document.querySelector('input[name="choiceCount"]:checked').value);
        totalPlayCount++;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        
        score = 0;
        timeLeft = 30;
        nextQuestion();
        
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').textContent = `TIME: ${timeLeft}`;
            if (timeLeft <= 5) document.body.classList.add('shake');
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function retryGame() {
        startGame();
    }

    function nextQuestion() {
        const opTag = activeOps[Math.floor(Math.random() * activeOps.length)];
        const op = opTag.replace('＋','+').replace('－','-');
        let n1, n2;

        if (op === '+') { n1 = Math.floor(Math.random() * 20) + 1; n2 = Math.floor(Math.random() * 20) + 1; correctAnswer = n1 + n2; }
        else if (op === '-') { n1 = Math.floor(Math.random() * 20) + 10; n2 = Math.floor(Math.random() * 10) + 1; correctAnswer = n1 - n2; }
        else if (op === '×') { n1 = Math.floor(Math.random() * 9) + 2; n2 = Math.floor(Math.random() * 9) + 2; correctAnswer = n1 * n2; }
        else if (op === '÷') { n2 = Math.floor(Math.random() * 9) + 2; correctAnswer = Math.floor(Math.random() * 9) + 2; n1 = n2 * correctAnswer; }

        document.getElementById('question').textContent = `${n1} ${opTag} ${n2}`;

        let options = [correctAnswer];
        while (options.length < numChoices) {
            let offset = Math.floor(Math.random() * 11) - 5;
            let wrong = correctAnswer + offset;
            if (wrong >= 0 && !options.includes(wrong)) options.push(wrong);
        }

        options.sort(() => Math.random() - 0.5);
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = opt;
            btn.onclick = () => {
                if (opt === correctAnswer) {
                    score++;
                    document.getElementById('score-display').textContent = `KILL COUNT: ${score}`;
                    nextQuestion();
                } else {
                    document.body.style.backgroundColor = '#600';
                    setTimeout(() => document.body.style.backgroundColor = '#1a1a1a', 100);
                }
            };
            choicesDiv.appendChild(btn);
        });
    }

    function endGame() {
        clearInterval(timerId);
        document.body.classList.remove('shake');
        document.getElementById('game-screen').classList.add('hidden');
        const resultScreen = document.getElementById('result-screen');
        resultScreen.classList.remove('hidden');

        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;

        let choiceMult = 1 + (numChoices - 2) * 0.2;
        let opBonus = activeOps.length * 0.1 + (activeOps.includes('×')?0.2:0) + (activeOps.includes('÷')?0.3:0);
        let finalAtk = Math.floor(score * 100 * choiceMult * (1 + opBonus));
        
        let currentAtk = 0;
        let step = Math.ceil(finalAtk / 30);
        if (step === 0) step = 1;
        let counter = setInterval(() => {
            currentAtk += step;
            if (currentAtk >= finalAtk) {
                currentAtk = finalAtk;
                clearInterval(counter);
                showRank(finalAtk);
            }
            document.getElementById('final-atk').textContent = currentAtk.toLocaleString();
        }, 30);

        document.getElementById('res-datetime').textContent = dateStr;
        document.getElementById('res-count').textContent = `${score} 問`;
        document.getElementById('res-ops').textContent = activeOps.join(' ');
        document.getElementById('res-choices').textContent = `${numChoices} 択`;
        document.getElementById('res-playcount').textContent = `${totalPlayCount} 回目`;
    }

    function showRank(atk) {
        let rank = 'F';
        let color = '#fff';
        if (atk >= 5000) { rank = 'SSS'; color = '#ff00ff'; }
        else if (atk >= 4000) { rank = 'SS'; color = '#ff4500'; }
        else if (atk >= 3000) { rank = 'S'; color = '#ffd700'; }
        else if (atk >= 2000) { rank = 'A'; color = '#ff69b4'; }
        else if (atk >= 1500) { rank = 'B'; color = '#00ff00'; }
        else if (atk >= 1000) { rank = 'C'; color = '#00ffff'; }
        else if (atk >= 500) { rank = 'D'; color = '#aaa'; }
        
        const rd = document.getElementById('rank-display');
        rd.textContent = rank;
        rd.style.color = color;
        rd.style.textShadow = `0 0 30px ${color}`;
    }
</script>
</body>
</html>
